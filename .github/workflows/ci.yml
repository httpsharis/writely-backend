name: Writely CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x] 

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # 🟢 SENIOR FIX 1: Explicitly install pnpm before setting up Node
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # Pinning to v9 guarantees stability across all environments

      - name: 🟢 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm' # 🟢 SENIOR FIX 2: Correctly cache pnpm to speed up builds

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Type Check (TypeScript Compiler)
        run: pnpm exec tsc --noEmit